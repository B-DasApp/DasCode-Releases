# One-shot recovery for the already-published Canary .8 release. Delete after success.
name: Recover Canary web 0.0.33-canary.20260816.8
run-name: recover-canary-web / v0.0.33-canary.20260816.8

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: none

concurrency:
  group: release-controller-canary
  cancel-in-progress: false

jobs:
  recover-web:
    name: Recover exact Canary .8 web release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout protected public recovery controller only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate original release and download its exact verified bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/recover-canary-web-20260816-8.mjs \
            --command acquire \
            --output "$RUNNER_TEMP/release-bundle.zip" \
            --controller-repository "$GITHUB_REPOSITORY" \
            --controller-repository-id "$GITHUB_REPOSITORY_ID" \
            --controller-ref "$GITHUB_REF" \
            --controller-ref-protected "$GITHUB_REF_PROTECTED" \
            --controller-sha "$GITHUB_SHA" \
            --controller-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --controller-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --controller-run-id "$GITHUB_RUN_ID" \
            --controller-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --default-branch "${{ github.event.repository.default_branch }}"

      - name: Safely extract the exact Actions artifact
        run: python3 scripts/safe-extract-zip.py "$RUNNER_TEMP/release-bundle.zip" "$RUNNER_TEMP/release-bundle"

      - id: bundle
        name: Revalidate the complete original release bundle
        run: |
          node scripts/validate-bundle.mjs \
            --bundle-dir "$RUNNER_TEMP/release-bundle" \
            --request-id dcr-31970670335-1-canary-5d237e478973 \
            --channel canary \
            --source-ref refs/heads/dascode/add-canary-release-channel \
            --source-sha 5d237e478973383f7ef2fc64280a162c9675cb91 \
            --version 0.0.33-canary.20260816.8 \
            --worker-run-id 31970700629 \
            --worker-run-attempt 1 \
            --controller-run-id 31970670335 \
            --controller-run-attempt 1 \
            --controller-workflow-sha c6de3de4a3e52ac961c38d7ae84054c3099621ec \
            --canary-marker-sha 993407dd9e57f1edf2f5681d70140bfefeca93cc \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up the locked Node release runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0

      - name: Install integrity-locked Vercel tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit

      - id: npm-package
        name: Reproduce and revalidate the npm publication bytes
        run: |
          node scripts/prepare-npm-publication.mjs \
            --archive "$RUNNER_TEMP/release-bundle/${{ steps.bundle.outputs.npm_path }}" \
            --version 0.0.33-canary.20260816.8 \
            --output-dir "$RUNNER_TEMP/npm-publication" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require the live Canary npm tag and exact registry integrity
        run: |
          node scripts/verify-npm-publication.mjs \
            --phase after \
            --tarball "${{ steps.npm-package.outputs.path }}" \
            --version 0.0.33-canary.20260816.8 \
            --dist-tag canary

      - name: Require the exact npm publication and immutable 14-asset release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/recover-canary-web-20260816-8.mjs \
            --command verify-public-state \
            --bundle-dir "$RUNNER_TEMP/release-bundle" \
            --npm-tarball "${{ steps.npm-package.outputs.path }}"

      - name: Redeploy exact web bytes, verify protected origin, then assign Canary alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Bind mutable secret values to the provider-owned original .8 target identity.
          node scripts/verify-vercel-deployment.mjs \
            --deployment-url https://dascode-f8r2nvf11-vasco-teixeiras-projects.vercel.app \
            --channel canary \
            --version 0.0.33-canary.20260816.8 \
            --source-sha 5d237e478973383f7ef2fc64280a162c9675cb91 \
            --verification-key "anchor-5d237e478973383f7ef2fc64280a162c9675cb91-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          deploy_root="$RUNNER_TEMP/vercel-deploy"
          python3 scripts/safe-extract-tar.py \
            "$RUNNER_TEMP/release-bundle/web/vercel-prebuilt.tgz" \
            "$deploy_root"

          # Vercel validates the configured monorepo root even for a prebuilt upload.
          mkdir -p "$deploy_root/apps/web" "$deploy_root/.vercel"
          DEPLOY_ROOT="$deploy_root" node -e 'const fs=require("fs"),p=process.env.DEPLOY_ROOT+"/.vercel/project.json";fs.writeFileSync(p,JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID})+"\n",{mode:0o600})'
          export NO_COLOR=1 NPM_CONFIG_IGNORE_SCRIPTS=true
          deployment_url="$(./node_modules/.bin/vercel deploy "$deploy_root" \
            --prebuilt --prod --skip-domain --archive=tgz --yes \
            --token "$VERCEL_TOKEN" | tail -n 1)"
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9-]+\.vercel\.app$ ]]

          node scripts/verify-vercel-deployment.mjs \
            --deployment-url "$deployment_url" \
            --channel canary \
            --version 0.0.33-canary.20260816.8 \
            --source-sha 5d237e478973383f7ef2fc64280a162c9675cb91 \
            --verification-key "5d237e478973383f7ef2fc64280a162c9675cb91-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          node scripts/assign-vercel-alias.mjs \
            --deployment-url "$deployment_url" \
            --domain canary.code.bclouder.dev \
            --channel canary

      - name: Verify the unauthenticated public Canary HTTPS marker
        run: node scripts/recover-canary-web-20260816-8.mjs --command verify-public-marker
